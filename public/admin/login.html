<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Sovereign Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background: #0a0e17; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { background: #111927; border: 1px solid #1a2332; border-radius: 16px; }
        .input-field { background: #0d1520; border: 1px solid #1a2332; border-radius: 8px; padding: 12px 16px; color: #fff; width: 100%; }
        .input-field:focus { outline: none; border-color: #4f46e5; }
        .btn-primary { background: #4f46e5; padding: 12px; border-radius: 8px; border: none; color: #fff; font-weight: 600; cursor: pointer; transition: all 0.3s; width: 100%; }
        .btn-primary:hover { background: #4338ca; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="login-card p-8 max-w-md w-full mx-4">
        <div class="text-center mb-8">
            <span class="text-3xl">⚡</span>
            <h1 class="text-2xl font-bold mt-2 bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Admin Login</h1>
            <p class="text-gray-400 text-sm mt-1">Enter your credentials to access the dashboard</p>
        </div>

        <form id="loginForm">
            <div class="mb-4">
                <label class="text-sm text-gray-400 block mb-1">Email</label>
                <input type="email" class="input-field" id="adminEmail" placeholder="admin@ailifesolution.com" required>
            </div>
            <div class="mb-6">
                <label class="text-sm text-gray-400 block mb-1">Password</label>
                <input type="password" class="input-field" id="adminPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div id="errorMsg" class="mt-4 text-red-400 text-sm text-center hidden"></div>

        <div class="mt-6 text-center text-xs text-gray-500">
            <p>Default: admin@ailifesolution.com / admin123</p>
            <p class="mt-1">🔒 Secure JWT authentication</p>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success && data.user?.role === 'admin') {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUser', JSON.stringify(data.user));
                    window.location.href = '/admin';
                } else {
                    errorMsg.classList.remove('hidden');
                    errorMsg.textContent = 'Invalid credentials or insufficient permissions';
                }
            } catch (error) {
                errorMsg.classList.remove('hidden');
                errorMsg.textContent = 'Network error. Please try again.';
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        });

        // Auto-redirect if already logged in
        if (localStorage.getItem('adminToken')) {
            window.location.href = '/admin';
        }
    </script>
</body>
</html>
