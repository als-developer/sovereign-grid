<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Sovereign Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0a0a0f;
            font-family: 'Inter', sans-serif;
        }
        .register-card {
            background: #111118;
            border: 1px solid #1a1a2e;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            margin: 20px;
        }
        .register-card h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .register-card .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-top: 8px;
        }
        .register-card label {
            display: block;
            color: #9ca3af;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .register-card input, 
        .register-card select {
            width: 100%;
            padding: 10px 14px;
            background: #0d0d15;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .register-card input:focus,
        .register-card select:focus {
            border-color: #6366f1;
        }
        .register-card select option {
            background: #0d0d15;
            color: #e0e0e0;
        }
        .register-btn {
            width: 100%;
            padding: 12px;
            background: #6366f1;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .register-btn:hover {
            background: #4f46e5;
        }
        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .result-box.success {
            display: block;
            background: #064e3b;
            border: 1px solid #10b981;
            color: #34d399;
        }
        .result-box.error {
            display: block;
            background: #7f1d1d;
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        .result-box.loading {
            display: block;
            background: #1e1b4b;
            border: 1px solid #6366f1;
            color: #818cf8;
        }
        .login-link {
            text-align: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #1a1a2e;
        }
        .login-link a {
            color: #6366f1;
            text-decoration: none;
            font-size: 14px;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .password-requirements {
            font-size: 11px;
            color: #6b7280;
            margin-top: 4px;
        }
        .password-requirements.valid {
            color: #34d399;
        }
        .field-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .field-error.visible {
            display: block;
        }
    </style>
</head>
<body>

<div class="flex items-center justify-center min-h-screen">
    <div class="register-card">
        <h1>⚡ Sovereign Grid</h1>
        <p class="subtitle">Create your account · v31.0</p>
        
        <form id="registerForm" style="margin-top: 24px;">
            <!-- Full Name -->
            <div style="margin-bottom: 16px;">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Zawadi Sanga" required>
            </div>
            
            <!-- Email -->
            <div style="margin-bottom: 16px;">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="zawadi@sovereigngrid.com" required>
                <div id="emailError" class="field-error">Please enter a valid email</div>
            </div>
            
            <!-- Password -->
            <div style="margin-bottom: 16px;">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
                <div id="passwordError" class="field-error">Password must be at least 6 characters</div>
                <div class="password-requirements" id="passwordHint">Min 6 characters</div>
            </div>
            
            <!-- Role -->
            <div style="margin-bottom: 20px;">
                <label for="role">Role</label>
                <select id="role">
                    <option value="super_admin">Super Admin</option>
                    <option value="admin">Admin</option>
                    <option value="investor">Investor</option>
                    <option value="enterprise" selected>Enterprise</option>
                    <option value="developer">Developer</option>
                </select>
            </div>
            
            <!-- Submit -->
            <button type="submit" class="register-btn" id="registerBtn">🔐 Create Account</button>
            
            <!-- Result -->
            <div id="result" class="result-box"></div>
        </form>
        
        <div class="login-link">
            <a href="/admin/login">Already have an account? Sign in</a>
        </div>
        
        <!-- Test Accounts Info -->
        <div style="margin-top: 16px; padding: 12px; background: #0d0d15; border-radius: 8px; font-size: 11px; color: #6b7280;">
            <strong style="color:#9ca3af;">📋 Default Test Accounts:</strong>
            <div style="margin-top: 4px;">
                <code style="display:block;color:#9ca3af;">admin@ailifesolution.com / admin123</code>
                <code style="display:block;color:#9ca3af;">zawadi@sovereigngrid.com / Zawadi@2026!</code>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';
        
        const form = document.getElementById('registerForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const roleSelect = document.getElementById('role');
        const resultDiv = document.getElementById('result');
        const registerBtn = document.getElementById('registerBtn');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const passwordHint = document.getElementById('passwordHint');

        // =====================================================
        // VALIDATION
        // =====================================================
        
        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        function validateForm() {
            let isValid = true;
            
            // Validate email
            if (!validateEmail(emailInput.value)) {
                emailError.classList.add('visible');
                isValid = false;
            } else {
                emailError.classList.remove('visible');
            }
            
            // Validate password
            if (!validatePassword(passwordInput.value)) {
                passwordError.classList.add('visible');
                passwordHint.classList.remove('valid');
                isValid = false;
            } else {
                passwordError.classList.remove('visible');
                passwordHint.classList.add('valid');
            }
            
            return isValid;
        }

        // Real-time validation
        emailInput.addEventListener('input', function() {
            if (this.value.length > 0 && !validateEmail(this.value)) {
                emailError.classList.add('visible');
            } else {
                emailError.classList.remove('visible');
            }
        });

        passwordInput.addEventListener('input', function() {
            if (this.value.length > 0 && !validatePassword(this.value)) {
                passwordError.classList.add('visible');
                passwordHint.classList.remove('valid');
            } else {
                passwordError.classList.remove('visible');
                passwordHint.classList.add('valid');
            }
        });

        // =====================================================
        // FORM SUBMISSION
        // =====================================================
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validate form
            if (!validateForm()) {
                resultDiv.className = 'result-box error';
                resultDiv.textContent = '❌ Please fix the errors before submitting.';
                return;
            }
            
            // Prepare data
            const name = nameInput.value.trim() || emailInput.value.split('@')[0];
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const role = roleSelect.value;
            
            // Disable button
            registerBtn.disabled = true;
            registerBtn.textContent = '⏳ Creating...';
            
            // Show loading
            resultDiv.className = 'result-box loading';
            resultDiv.textContent = '⏳ Creating your account...';
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        name: name,
                        email: email, 
                        password: password, 
                        role: role 
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Save token
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }
                    
                    resultDiv.className = 'result-box success';
                    resultDiv.innerHTML = `
                        ✅ <strong>Account created successfully!</strong><br>
                        Email: <strong>${email}</strong><br>
                        Role: <strong>${role}</strong><br><br>
                        <a href="/admin/login" style="color:#818cf8;text-decoration:underline;">Go to Login →</a>
                    `;
                    
                    // Auto redirect after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/admin/login';
                    }, 3000);
                } else {
                    resultDiv.className = 'result-box error';
                    resultDiv.textContent = `❌ Error: ${data.error || 'Something went wrong'}`;
                }
            } catch (error) {
                console.error('Registration error:', error);
                resultDiv.className = 'result-box error';
                resultDiv.textContent = `❌ Network error: ${error.message || 'Unable to connect to server'}`;
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = '🔐 Create Account';
            }
        });
        
        // =====================================================
        // AUTO-FILL DEMO (for quick testing)
        // =====================================================
        
        // Check URL params for auto-fill
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('email')) {
            emailInput.value = urlParams.get('email');
        }
        if (urlParams.get('name')) {
            nameInput.value = urlParams.get('name');
        }
        
        console.log('📝 Registration page loaded successfully');
        console.log('📍 URL:', window.location.href);
    })();
</script>

</body>
</html>
