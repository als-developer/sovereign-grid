<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Grid - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0a0a0f;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #111118;
            border: 1px solid #1a1a2e;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-card h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .login-card .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-top: 8px;
        }
        .login-card label {
            display: block;
            color: #9ca3af;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .login-card input {
            width: 100%;
            padding: 10px 14px;
            background: #0d0d15;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .login-card input:focus {
            border-color: #6366f1;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #6366f1;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #4f46e5;
        }
        .logout-btn {
            width: 100%;
            padding: 10px;
            background: #ef4444;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .logout-btn:hover {
            background: #dc2626;
        }
        .error-msg {
            color: #ef4444;
            font-size: 14px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }
        .test-accounts {
            margin-top: 16px;
            padding: 12px;
            background: #0d0d15;
            border-radius: 8px;
            font-size: 12px;
            color: #6b7280;
        }
        .test-accounts code {
            display: block;
            color: #9ca3af;
            font-size: 11px;
            padding: 2px 0;
        }
        .clear-session-btn {
            width: 100%;
            padding: 8px;
            background: transparent;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            color: #6b7280;
            font-size: 12px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .clear-session-btn:hover {
            border-color: #6366f1;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>⚡ Sovereign Grid</h1>
        <p class="subtitle">Admin Login · v31.0</p>
        
        <!-- Clear Session Button -->
        <button onclick="clearSession()" class="clear-session-btn">
            🗑️ Clear Session & Logout
        </button>
        
        <form id="loginForm" style="margin-top: 16px;">
            <div style="margin-bottom: 16px;">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="admin@ailifesolution.com" required>
            </div>
            <div style="margin-bottom: 20px;">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="login-btn">🔐 Sign In</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
        
        <!-- Logout Button (Visible if logged in) -->
        <button id="logoutBtn" onclick="forceLogout()" class="logout-btn" style="display:none;">
            🚪 Force Logout
        </button>
        
        <div class="test-accounts">
            <strong style="color:#9ca3af;">📋 Test Accounts:</strong>
            <code>admin@ailifesolution.com / admin123</code>
            <code>admin@sovereigngrid.com / Sovereign@Admin2026!</code>
            <code>tech@sovereigngrid.com / Tech@Sovereign2026!</code>
            <code>investor.lead@sovereigngrid.com / Investor@Lead2026!</code>
        </div>
    </div>

    <script>
        // =====================================================
        // CLEAR SESSION - Force logout and clear all storage
        // =====================================================
        
        function clearSession() {
            // Clear localStorage
            localStorage.clear();
            
            // Clear sessionStorage
            sessionStorage.clear();
            
            // Clear cookies
            document.cookie.split(";").forEach(function(c) {
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
            });
            
            // Reload page
            location.reload();
            
            alert("✅ Session cleared! Please login again.");
        }
        
        function forceLogout() {
            fetch('/api/auth/logout', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                }
            }).then(() => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/admin/login';
            }).catch(() => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/admin/login';
            });
        }

        // =====================================================
        // LOGIN FORM
        // =====================================================
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';
            
            if (!email || !password) {
                errorMsg.textContent = 'Please enter both email and password';
                errorMsg.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/admin';
                } else {
                    errorMsg.textContent = data.error || 'Invalid credentials';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.style.display = 'block';
            }
        });

        // =====================================================
        // CHECK IF ALREADY LOGGED IN
        // =====================================================
        
        async function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch('/api/auth/verify', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    const data = await response.json();
                    
                    if (data.success) {
                        // Show logout button
                        document.getElementById('logoutBtn').style.display = 'block';
                        document.getElementById('email').value = data.user?.email || '';
                        document.getElementById('password').placeholder = 'Already logged in';
                    }
                } catch (error) {
                    console.log('Not logged in');
                }
            }
        }
        
        // Check auth on page load
        checkAuth();
    </script>
</body>
</html>
